name: stage-build

# Build stage, called by jira-router when a card reaches "Ready for Build".
# PHASE 4 STUB: moves the card to "In Build" and stops, so a person can open a PR titled "<KEY>: ..."
# to test the PR -> Jira sync. Phase 6 replaces the stub with: create an issue from the approved spec
# and assign it to the Copilot coding agent.

on:
  workflow_call:
    inputs:
      issue_key:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KEY: ${{ inputs.issue_key }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the build (stub)
        run: |
          sha="$(bash scripts/jira/get-field.sh "$KEY" approvedSpecSha)"
          bash scripts/jira/transition.sh "$KEY" "$(jq -r .jira.statuses.inBuild.name config/pipeline.json)"
          bash scripts/jira/comment.sh "$KEY" "Build started from approved spec ${sha} (pipeline test stub). In Phase 6 the Copilot coding agent implements it here. To test the PR sync, open a PR titled '${KEY}: <summary>'." "$RUN_URL"
          bash scripts/jira/release.sh "$KEY" --reset-attempts
