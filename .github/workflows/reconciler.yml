name: reconciler

# Safety net every 15 minutes (and on demand after a spec is approved):
# re-sends lost Jira events, retries runs that died, and moves approved specs into the build
# queue while builds in flight stay under the WIP limit. See scripts/jira/reconcile.sh.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip until Jira is configured
        id: cfg
        run: |
          if [[ -z "$JIRA_USER" || -z "$JIRA_API_TOKEN" ]]; then
            echo "::notice::JIRA_USER / JIRA_API_TOKEN secrets not set; reconciler is idle."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconcile
        if: steps.cfg.outputs.ready == 'true'
        run: bash scripts/jira/reconcile.sh | tee -a "$GITHUB_STEP_SUMMARY"
